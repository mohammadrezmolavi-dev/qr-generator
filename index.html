<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR.ir — کد QR بساز</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');

  :root{
    --bg:#06070c;
    --card:#0e1018cc;
    --line:#242840;
    --line-soft:#1a1d2e;
    --ink:#eeeefc;
    --slate:#8b8fae;
    --violet:#8b5cf6;
    --cyan:#22d3ee;
    --grad: linear-gradient(135deg, #8b5cf6, #22d3ee);
    --danger:#f97066;
  }

  :root[data-theme="light"]{
    --bg:#eef0fa;
    --card:#ffffffd9;
    --line:#dcdfef;
    --line-soft:#f3f4fc;
    --ink:#1b1c2b;
    --slate:#6b6f92;
    --danger:#e0483a;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Vazirmatn', sans-serif;
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
    transition:background .5s ease, color .5s ease;
  }

  /* ambient background */
  .bg-layer{position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none;}
  .blob{position:absolute; border-radius:50%; filter:blur(80px); opacity:.35;}
  .blob1{width:520px; height:520px; background:#8b5cf6; top:-160px; left:-120px; animation:float1 16s ease-in-out infinite;}
  .blob2{width:480px; height:480px; background:#22d3ee; bottom:-180px; right:-140px; animation:float2 18s ease-in-out infinite;}
  @keyframes float1{0%,100%{transform:translate(0,0);} 50%{transform:translate(60px,50px);}}
  @keyframes float2{0%,100%{transform:translate(0,0);} 50%{transform:translate(-50px,-40px);}}
  [data-theme="light"] .blob{opacity:.18;}

  .qr-grid{
    position:absolute; inset:0;
    background-image:radial-gradient(circle, #ffffff10 1px, transparent 1.4px);
    background-size:26px 26px;
    mask-image:radial-gradient(circle at 50% 30%, black, transparent 75%);
    transition:opacity .5s ease;
  }
  [data-theme="light"] .qr-grid{opacity:.3;}

  .screen{
    position:relative; z-index:1;
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding:24px;
  }
  .hidden{display:none !important;}

  .brand{display:flex; align-items:center; gap:10px; justify-content:center;}
  .brand-mark{
    width:34px; height:34px; border-radius:9px;
    background:var(--grad);
    display:flex; align-items:center; justify-content:center;
    font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:14px; color:#0a0a12;
  }
  .brand-name{font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:17px; letter-spacing:.02em;}

  /* ---------- App screen ---------- */
  .app-wrap{width:100%; max-width:520px;}
  .app-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:30px;}
  .logout-btn{
    background:var(--line-soft); border:1px solid var(--line); color:var(--slate);
    font-size:12px; padding:8px 14px; border-radius:9px; cursor:pointer;
  }
  .logout-btn:hover{color:var(--ink); border-color:var(--violet);}

  .hero-title{
    font-family:'Space Grotesk', sans-serif;
    font-size:clamp(24px, 5vw, 32px);
    font-weight:700;
    text-align:center;
    margin:0 0 8px;
  }
  .hero-title span{
    background:var(--grad);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .hero-sub{text-align:center; color:var(--slate); font-size:13.5px; margin:0 0 30px;}

  .gen-card{
    background:var(--card);
    backdrop-filter:blur(18px);
    border:1px solid var(--line);
    border-radius:20px;
    padding:26px;
    transition:background .5s ease, border-color .5s ease;
  }
  .url-row{display:flex; gap:10px;}
  .url-row input{
    flex:1;
    background:var(--line-soft);
    border:1px solid var(--line);
    color:var(--ink);
    border-radius:11px;
    padding:13px 16px;
    font-family:'JetBrains Mono', monospace;
    font-size:13px;
    direction:ltr; text-align:left;
    outline:none;
    transition:border-color .15s ease, box-shadow .15s ease, background .5s ease, color .5s ease;
  }
  .url-row input:focus{border-color:var(--cyan); box-shadow:0 0 0 3px #22d3ee2a;}
  .gen-btn{
    background:var(--grad);
    border:none; color:#0a0a12; font-weight:700; font-size:13.5px;
    padding:0 22px; border-radius:11px; cursor:pointer; white-space:nowrap;
    transition:transform .12s ease, filter .12s ease;
  }
  .gen-btn:hover{filter:brightness(1.08); transform:translateY(-1px);}
  .url-error{color:var(--danger); font-size:12px; margin-top:8px; min-height:14px;}

  .result-zone{
    margin-top:24px;
    display:flex; flex-direction:column; align-items:center;
    max-height:0; opacity:0; overflow:hidden;
    transition:max-height .5s ease, opacity .4s ease;
  }
  .result-zone.show{max-height:700px; opacity:1;}

  .qr-frame{
    position:relative;
    padding:16px;
    border-radius:20px;
    background:var(--grad);
    animation:glowPulse 3s ease-in-out infinite;
    width:100%;
    max-width:340px;
    margin:0 auto;
  }
  @keyframes glowPulse{
    0%,100%{box-shadow:0 0 0px 0 #8b5cf655;}
    50%{box-shadow:0 0 34px 4px #8b5cf655;}
  }
  .qr-inner{
    background:#ffffff;
    border-radius:14px;
    padding:14px;
    line-height:0;
    position:relative;
    overflow:hidden;
  }
  #qrCanvas{display:block; border-radius:6px; width:100%; height:auto; max-width:100%;}

  .scan-line{
    position:absolute; left:0; right:0; height:2px; top:0;
    background:linear-gradient(90deg, transparent, var(--cyan) 20%, var(--violet) 80%, transparent);
    box-shadow:0 0 12px 1px var(--cyan);
    opacity:0;
  }
  .scan-line.sweep{animation:sweep .9s cubic-bezier(.4,0,.2,1);}
  @keyframes sweep{
    0%{top:0; opacity:1;} 92%{opacity:1;} 100%{top:100%; opacity:0;}
  }

  .result-url{
    margin-top:16px;
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    color:var(--slate);
    direction:ltr;
    max-width:100%;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    text-align:center;
  }

  .dl-row{display:flex; gap:10px; margin-top:18px; width:100%;}
  .dl-btn{
    flex:1;
    background:var(--line-soft);
    border:1px solid var(--line);
    color:var(--ink);
    border-radius:11px;
    padding:12px;
    font-weight:600;
    font-size:13px;
    cursor:pointer;
    transition:border-color .15s ease, color .15s ease;
    font-family:'Vazirmatn', sans-serif;
  }
  .dl-btn:hover{border-color:var(--cyan); color:var(--cyan);}
  .dl-btn.primary{background:var(--grad); border:none; color:#0a0a12;}
  .dl-btn.primary:hover{filter:brightness(1.08); color:#0a0a12;}

  /* ---------- Theme toggle ---------- */
  .theme-toggle{
    position:fixed; top:18px; left:18px; z-index:50;
    background:none; border:none; padding:0; cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .toggle-track{
    width:60px; height:30px; border-radius:999px;
    background:linear-gradient(180deg, #12141f, #1b1e30);
    border:1px solid var(--line);
    position:relative; display:block; overflow:hidden;
    box-shadow:inset 0 0 0 1px #ffffff0a, inset 0 2px 6px #00000055;
    transition:background .5s ease, border-color .5s ease;
  }
  [data-theme="light"] .toggle-track{
    background:linear-gradient(180deg, #dce6ff, #eef2ff);
  }
  .theme-toggle:hover .toggle-track{box-shadow:inset 0 0 0 1px #ffffff0a, inset 0 2px 6px #00000055, 0 0 12px 1px #8b5cf655;}
  [data-theme="light"] .theme-toggle:hover .toggle-track{box-shadow:0 0 12px 1px #22d3ee55;}
  .theme-toggle:active .toggle-thumb{filter:brightness(.9);}
  .toggle-star{position:absolute; border-radius:50%; background:#ffffff; opacity:.9; transition:opacity .3s ease;}
  .ts1{width:3px; height:3px; top:7px; left:10px;}
  .ts2{width:2px; height:2px; top:17px; left:16px;}
  .ts3{width:2.5px; height:2.5px; top:9px; left:22px;}
  [data-theme="light"] .toggle-star{opacity:0;}
  .toggle-thumb{
    position:absolute; top:3px; left:3px; width:24px; height:24px; border-radius:50%;
    background:radial-gradient(circle at 30% 30%, #dcdfff, #9d8cf7 60%, #7c5ce0);
    box-shadow:0 2px 8px #00000066, 0 0 10px 1px #8b5cf655;
    transition:transform .5s cubic-bezier(.34,1.56,.64,1), background .5s ease;
    display:flex; align-items:center; justify-content:center; overflow:hidden;
  }
  [data-theme="light"] .toggle-thumb{
    transform:translateX(30px);
    background:radial-gradient(circle at 35% 35%, #ffffff, #ffd76b 65%, #ffb703);
    box-shadow:0 2px 8px #00000033, 0 0 10px 1px #ffb70366;
  }
  .toggle-thumb svg{position:absolute; transition:opacity .35s ease, transform .5s cubic-bezier(.34,1.56,.64,1);}
  .icon-moon{opacity:1; transform:rotate(0deg) scale(1);}
  .icon-sun{opacity:0; transform:rotate(-90deg) scale(.5);}
  [data-theme="light"] .icon-moon{opacity:0; transform:rotate(90deg) scale(.5);}
  [data-theme="light"] .icon-sun{opacity:1; transform:rotate(0deg) scale(1);}

  @media (max-width:480px){
    .url-row{flex-direction:column;}
    .gen-btn{padding:13px; width:100%;}
  }

  /* ---------- Loading state ---------- */
  .loading-zone{
    margin-top:24px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    max-height:0; opacity:0; overflow:hidden;
    transition:max-height .4s ease, opacity .3s ease;
  }
  .loading-zone.show{max-height:300px; opacity:1;}
  #loadingAnim{width:150px; height:150px;}
  .loading-text{color:var(--slate); font-size:13px; margin-top:4px;}
  .gen-btn:disabled{opacity:.6; cursor:not-allowed; filter:none; transform:none;}
</style>
</head>

<!-- APP SCREEN -->
<div class="screen" id="appScreen">
  <div class="app-wrap">
    <div class="app-header" style="justify-content:center;">
      <div class="brand">
        <div class="brand-mark">QR</div>
        <div class="brand-name">QR.ir</div>
      </div>
    </div>

    <h1 class="hero-title">لینکت رو <span>کد QR</span> کن</h1>
    <p class="hero-sub">فقط آدرس رو بچسبون و بگیر</p>

    <div class="gen-card">
      <div class="url-row">
        <input type="text" id="urlInput" placeholder="https://example.com" autocomplete="off">
        <button class="gen-btn" id="genBtn">بساز</button>
      </div>
      <div class="url-error" id="urlError"></div>

      <div class="loading-zone" id="loadingZone">
        <div id="loadingAnim"></div>
        <div class="loading-text">در حال ساخت کد QR...</div>
      </div>

      <div class="result-zone" id="resultZone">
        <div class="qr-frame">
          <div class="qr-inner">
            <canvas id="qrCanvas" width="480" height="480"></canvas>
            <div class="scan-line" id="scanLine"></div>
          </div>
        </div>
        <div class="result-url" id="resultUrlText"></div>
        <div class="dl-row">
          <button class="dl-btn primary" id="dlPng">دانلود PNG</button>
          <button class="dl-btn" id="dlSvg">دانلود SVG</button>
        </div>
      </div>
    </div>
  </div>
</div>

function initLottie(){
  if(lottieInstance) return;
  lottieInstance = lottie.loadAnimation({
    container: document.getElementById('loadingAnim'),
    renderer: 'svg',
    loop: true,
    autoplay: false,
    animationData: loadingAnimData
  });
}

function normalizeUrl(v){
  v = v.trim();
  if(!v) return null;
  if(!/^https?:\/\//i.test(v)) v = 'https://' + v;
  try{ return new URL(v).href; }catch(e){ return null; }
}

function buildMatrix(text){
  const holder = document.createElement('div');
  const qr = new QRCode(holder, { text: text, correctLevel: QRCode.CorrectLevel.M });
  const model = qr._oQRCode;
  const count = model.getModuleCount();
  const matrix = [];
  for(let r=0;r<count;r++){
    const row = [];
    for(let c=0;c<count;c++) row.push(model.isDark(r,c));
    matrix.push(row);
  }
  return matrix;
}

function roundRectPath(ctx, x, y, w, h, r){
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}

const FG = '#0d0f1a';
const BG = '#ffffff';
const SIZE = 480;

function renderCanvas(matrix){
  const count = matrix.length;
  const quiet = 4;
  const total = count + quiet*2;
  const scaleFactor = 2;
  canvas.width = SIZE*scaleFactor;
  canvas.height = SIZE*scaleFactor;
  const ctx = canvas.getContext('2d');
  const px = (SIZE*scaleFactor)/total;

  ctx.fillStyle = BG;
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle = FG;

  for(let r=0;r<count;r++){
    for(let c=0;c<count;c++){
      if(matrix[r][c]){
        const x = (c+quiet)*px, y=(r+quiet)*px;
        const rad = px*0.32;
        const w = px*0.94, off=(px-w)/2;
        ctx.beginPath();
        roundRectPath(ctx, x+off, y+off, w, w, rad);
        ctx.fill();
      }
    }
  }
}

function buildSvgString(matrix){
  const count = matrix.length;
  const quiet = 4;
  const total = count + quiet*2;
  let shapes = '';
  for(let r=0;r<count;r++){
    for(let c=0;c<count;c++){
      if(!matrix[r][c]) continue;
      const x=c+quiet, y=r+quiet;
      shapes += `<rect x="${x+0.03}" y="${y+0.03}" width="0.94" height="0.94" rx="0.3" fill="${FG}"/>`;
    }
  }
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${total} ${total}" width="${SIZE}" height="${SIZE}">` +
    `<rect width="${total}" height="${total}" fill="${BG}"/>` + shapes + `</svg>`;
}

    lottieInstance.stop();
    genBtn.disabled = false;

    renderCanvas(matrix);
    currentSvgString = buildSvgString(matrix);
    resultUrlText.textContent = normalized;
    resultZone.classList.add('show');

    scanLine.classList.remove('sweep');
    void scanLine.offsetWidth;
    scanLine.classList.add('sweep');
  }, 3000);
}

genBtn.addEventListener('click', generate);
urlInput.addEventListener('keydown', (e)=>{ if(e.key === 'Enter') generate(); });

document.getElementById('dlPng').addEventListener('click', ()=>{
  const link = document.createElement('a');
  link.download = 'qr-code.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
});
document.getElementById('dlSvg').addEventListener('click', ()=>{
  const blob = new Blob([currentSvgString], {type:'image/svg+xml'});
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.download = 'qr-code.svg';
  link.href = url;
  link.click();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
});
</script>
</body>
</html>
